# Phase 2 — PostgreSQL + pgvector, run via Docker Compose instead of a
# long `docker run` command. This also sets up a named volume so your
# data survives container restarts, and makes it trivial to add the
# backend/frontend services here in later phases (Phase 10).
#
# Phase 10 — added the api and frontend services, so the whole stack
# starts with one `docker compose up -d` instead of three separate
# terminals. Ollama stays outside Docker (runs on your host machine as
# normal) — the api service reaches it via host.docker.internal,
# Docker's special DNS name for "the machine running Docker," rather
# than trying to containerize Ollama itself, which would add GPU/model
# management complexity this project doesn't need.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: medical-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medical_rag
    ports:
      - "5432:5432"
    volumes:
      - medical_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Without this, `depends_on` only waits for the container to
      # start, not for Postgres to actually be ready to accept
      # connections — a race condition that works "most of the time"
      # locally and then randomly fails. pg_isready checks real
      # readiness.
      test: ["CMD-SHELL", "pg_isready -U raguser -d medical_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: medical-rag-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
 

  frontend:
    build: .
    container_name: medical-rag-frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # "api" here is the service name above — Docker's internal DNS
      # resolves it to the api container's address automatically.
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "frontend.py", "--server.address=0.0.0.0"]

volumes:
  medical_rag_pgdata:
